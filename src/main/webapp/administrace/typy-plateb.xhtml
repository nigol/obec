<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://xmlns.jcp.org/jsf/html"
		xmlns:f="http://xmlns.jcp.org/jsf/core"
		xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
		template="/WEB-INF/templates/template.xhtml"
		xmlns:p="http://primefaces.org/ui">

		<ui:param name="title" value="Typy plateb, administrace • Obec Tršice"/>

		<ui:define name="content">
			<h2>Typy plateb, administrace</h2>
			
			<h:form id="paymentTypeForm">				
				<p:panelGrid layout="grid" columns="5" styleClass="ui-noborder">
					<p:commandButton value="Nová položka" 
							action="#{paymentAdminBean.newPaymentType}"
							update="@form :growl"
							resetValues="true"/>
				</p:panelGrid>
				
				<p:dataTable id="paymentTypes" 
						value="#{paymentAdminBean.paymentTypes}" 
						emptyMessage="Nenalezen žádný výsledek."
						rowKey="#{paymentType.id}"
						rows="20"
						paginator="true"
						paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
						paginatorPosition="bottom"
						var="paymentType">
					
					<p:column headerText="ID typu">
						<p:inputText id="id" value="#{paymentType.symbol}" style="width:100%"/>
					</p:column>

					<p:column headerText="Popis">
						<p:inputText id="label" value="#{paymentType.label}" style="width:70%"/>
						 ⋮ 
						<p:commandButton value="💾" 
							action="#{paymentAdminBean.savePaymentType(paymentType)}"
							update="@form :growl"
							style="width:20%"
							resetValues="true"/>
					</p:column>
				</p:dataTable>
			</h:form>
		</ui:define>
	</ui:composition>
